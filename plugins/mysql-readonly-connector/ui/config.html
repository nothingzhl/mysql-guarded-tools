<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MySQL 连接管理</title>
<style>
  :root{color-scheme:light;--ink:#20221f;--muted:#85877f;--line:#e9eae5;--paper:#f7f8f5;--green:#356e52;--pale:#e9f2eb;--orange:#a96724;--shadow:0 18px 48px #26301c12}
  *{box-sizing:border-box}body{margin:0;background:#f1f2ef;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
  button{font:inherit;color:inherit;cursor:pointer}.app{width:min(1180px,calc(100vw - 56px));min-height:720px;margin:34px auto;background:#fff;border:1px solid #e5e7e1;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:256px 1fr}
  aside{background:#fafbf9;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 28px;font-size:14px;font-weight:650;letter-spacing:.1px}.brand-icon{height:34px;width:34px;border-radius:11px;background:#e7f0e8;color:var(--green);display:grid;place-items:center}.brand-icon svg{width:19px}
  .nav-label{font-size:10px;color:#a2a49e;letter-spacing:1.1px;padding:0 11px;margin:0 0 10px}.nav-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:9px;color:#73766f;margin:1px 0}.nav-item.active{color:#2e6448;background:#eaf2eb;font-weight:600}.nav-item svg{width:16px;height:16px;opacity:.85}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:17px 10px 0;color:#8b8d87;font-size:11px;display:flex;align-items:center;gap:8px}.live{height:7px;width:7px;border-radius:50%;background:#62a875;box-shadow:0 0 0 3px #e6f2e8}
  main{padding:36px 42px 32px;max-width:940px;width:100%;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}.crumb{font-size:12px;color:#92948e}.avatar{height:32px;width:32px;border-radius:50%;background:#f2eee6;color:#78674e;display:grid;place-items:center;font-size:12px;font-weight:650}.heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:25px}.eyebrow{color:#8b8e86;font-size:11px;margin-bottom:6px}h1{font-size:25px;letter-spacing:-.5px;margin:0;font-weight:650}.sub{margin:7px 0 0;color:#85877f;font-size:12px}.add{border:1px solid #dfe5de;background:#fff;border-radius:9px;padding:9px 13px;color:#356e52;font-size:12px;font-weight:600;box-shadow:0 2px 5px #20301908}.add b{font-size:16px;vertical-align:-1px;margin-right:5px;font-weight:400}
  .layout{display:grid;grid-template-columns:275px minmax(0,1fr);gap:18px}.card{border:1px solid var(--line);border-radius:12px;background:#fff}.list-card{padding:14px 10px}.list-head{display:flex;justify-content:space-between;align-items:center;padding:2px 8px 12px;font-size:11px;color:#90928b}.count{background:#f1f2ef;border-radius:20px;padding:2px 7px;color:#74766f;font-size:10px}.conn{border:1px solid transparent;padding:12px 10px;border-radius:9px;margin:3px 0;cursor:pointer}.conn:hover{background:#f8f9f7}.conn.selected{background:#f1f6f1;border-color:#dfebdf}.conn-top{display:flex;align-items:center;gap:9px}.dbicon{height:30px;width:30px;background:#f1f3ef;border-radius:8px;display:grid;place-items:center;color:#72786e}.selected .dbicon{background:#e5efe5;color:#386a4b}.dbicon svg{width:16px}.conn-name{font-weight:620;font-size:12px}.default-tag{font-size:9px;color:#37724f;background:#e2efe4;border-radius:4px;padding:2px 5px;margin-left:auto}.conn-db{font-size:10px;color:#969890;margin:7px 0 0 39px}.list-footer{border-top:1px solid var(--line);margin:10px 3px 0;padding:13px 6px 1px;color:#a0a29c;font-size:10px}
  .detail{padding:21px 22px 19px}.detail-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}.conn-title{display:flex;align-items:center;gap:11px}.conn-title .dbicon{width:37px;height:37px}.conn-title h2{font-size:16px;margin:0 0 2px;font-weight:650}.host{font-size:10px;color:#969890}.status{display:flex;align-items:center;gap:6px;font-size:10px;color:#49805b;background:#eff6f0;padding:5px 8px;border-radius:20px}.status i{width:6px;height:6px;border-radius:50%;background:#5ca873}.section{padding:17px 0 15px;border-bottom:1px solid var(--line)}.section:last-of-type{border:0}.section-title{font-size:11px;font-weight:650;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}.section-title span{font-size:10px;font-weight:400;color:#a0a29c}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px 20px}.field label{font-size:10px;color:#999b95;display:block;margin-bottom:5px}.value{font-size:11px;color:#383a36}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}.inline{display:flex;align-items:center;gap:7px}.shield{color:#699176;font-size:12px}.readonly{display:flex;align-items:center;justify-content:space-between;border:1px solid #e9ebe6;background:#fafbf9;border-radius:8px;padding:10px 11px}.readonly strong{font-size:11px;font-weight:600}.readonly small{display:block;color:#9a9c96;font-size:9px;margin-top:3px}.pill{font-size:9px;border-radius:10px;padding:4px 7px;background:#e8f2e9;color:#477c56}.pill.off{background:#f0f1ee;color:#85877f}.actions{display:flex;gap:9px;padding-top:16px}.action{border:1px solid #e4e6e0;background:#fff;border-radius:7px;padding:8px 10px;font-size:10px;color:#656861}.action.primary{border-color:#d8e7db;color:#356e52;background:#f4f8f4}.hint{color:#a0a29c;font-size:9px;margin:13px 2px 0}.toast{z-index:10;position:fixed;bottom:26px;left:50%;transform:translate(-50%,12px);background:#252a25;color:#fff;padding:10px 15px;border-radius:8px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
  .action.danger{color:#a2544c;border-color:#f0e2df}.switch{appearance:none;width:30px;height:17px;border-radius:12px;background:#d9dbd6;position:relative;cursor:pointer;vertical-align:middle;transition:.15s}.switch:after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;background:#fff;border-radius:50%;box-shadow:0 1px 2px #0002;transition:.15s}.switch:checked{background:#5c966c}.switch:checked:after{left:15px}.modal-backdrop{position:fixed;inset:0;background:#1e241f66;display:none;place-items:center;padding:20px;z-index:5}.modal-backdrop.open{display:grid}.modal{width:min(500px,100%);background:white;border-radius:14px;padding:24px;box-shadow:0 24px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.modal-head h2{font-size:17px;margin:0}.modal-head p{color:#898c84;font-size:11px;margin:5px 0}.close{border:0;background:transparent;color:#8d9088;font-size:21px;line-height:1}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-field.full{grid-column:1/-1}.form-field label{display:block;font-size:10px;color:#757870;margin-bottom:6px}.form-field input,.form-field select{width:100%;border:1px solid #e1e4de;border-radius:7px;padding:9px 10px;font:inherit;font-size:12px;outline:none}.form-field input:focus,.form-field select:focus{border-color:#80a88b;box-shadow:0 0 0 3px #e8f2e9}.form-check{display:flex;align-items:center;gap:8px;font-size:11px;color:#50534d}.form-note{font-size:10px;color:#a0a29c;line-height:1.5;margin:14px 0 0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:16px;margin-top:19px}.empty{padding:22px 10px;text-align:center;color:#9a9c96;font-size:11px}
  @media(max-width:760px){.app{width:100%;min-height:100vh;margin:0;border-radius:0;grid-template-columns:62px 1fr}aside{padding:19px 9px}.brand{padding:0 5px 25px}.brand>span:last-child,.nav-label,.nav-item span,.side-bottom span{display:none}.nav-item{justify-content:center;padding:12px 0}.side-bottom{justify-content:center;padding:17px 0 0}.layout{grid-template-columns:1fr}main{padding:24px 18px}.list-card{display:grid;grid-template-columns:1fr 1fr;gap:4px}.list-head,.list-footer{grid-column:1/-1}.heading{align-items:flex-start}.fields{gap:12px}.detail{padding:17px}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="7.5" ry="3"/><path d="M4.5 5v14c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V5M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg></span><span>数据连接</span></div>
    <div class="nav-label">工作区</div>
    <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span>MySQL 连接</span></div>
    <div class="nav-item" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="8" cy="5" r="2" fill="#fafbf9"/><circle cx="15" cy="12" r="2" fill="#fafbf9"/></svg><span>偏好设置</span></div>
    <div class="side-bottom"><i class="live"></i><span><span id="connection-status">正在加载真实连接…</span></span></div>
  </aside>
  <main>
    <div class="topline"><div class="crumb">工作区&nbsp; / &nbsp;连接管理</div><div class="avatar">张</div></div>
    <div class="heading"><div><div class="eyebrow">数据库设置</div><h1>MySQL 连接</h1><p class="sub">管理连接信息，查看权限与连接状态</p></div><button class="add" onclick="openModal()"><b>＋</b>新增连接</button></div>
    <div class="layout">
      <section class="card list-card"><div class="list-head"><span>已保存的连接</span><span class="count">4 个</span></div><div id="connection-list"></div><div class="list-footer">此页面只显示密码是否已设置</div></section>
      <section class="card detail" id="detail"></section>
    </div>
    <p class="hint">管理真实 MySQL 连接 · 保存后立即生效 · 密码从环境变量读取；修改变量后重启 Codex</p>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">新增连接</h2><p>填写非密码配置项。</p></div><button class="close" onclick="closeModal()" aria-label="关闭">×</button></div><form id="connection-form"><div class="form-grid"><div class="form-field"><label for="f-name">连接名称</label><input id="f-name" name="name" pattern="[A-Za-z0-9_-]{1,64}" required placeholder="例如 staging" autocomplete="off"></div><div class="form-field"><label for="f-db">默认数据库</label><input id="f-db" name="db" required placeholder="database_name"></div><div class="form-field full"><label for="f-host">主机地址</label><input id="f-host" name="host" required placeholder="mysql.example.com"></div><div class="form-field"><label for="f-port">端口</label><input id="f-port" name="port" type="number" min="1" max="65535" value="3306" required></div><div class="form-field"><label for="f-user">用户名</label><input id="f-user" name="user" required placeholder="数据库用户名"></div><div class="form-field"><label for="f-pool">连接池上限</label><input id="f-pool" name="pool" type="number" min="1" max="10" value="2" required></div><div class="form-field"><label for="f-timeout">连接超时（毫秒）</label><input id="f-timeout" name="timeout" type="number" min="1000" max="120000" value="10000" required></div><label class="form-check"><input type="checkbox" name="ssl"> 启用 SSL 连接</label><label class="form-check"><input type="checkbox" name="update"> 允许受控 UPDATE</label><label class="form-check"><input type="checkbox" name="verify" checked> 校验 SSL 证书</label><div class="form-field full"><label for="password-source">密码来源</label><select name="password_source" id="password-source"><option value="MYSQL_PASSWORD">MYSQL_PASSWORD（共用密码）</option><option value="MYSQL_PASSWORDS_JSON">MYSQL_PASSWORDS_JSON（按名称分别配置）</option></select></div><div class="form-field full"><label for="password-key">JSON 中的密码名称</label><input id="password-key" name="password_key" pattern="[A-Za-z0-9_-]{1,64}" placeholder="默认使用连接名称"></div></div><p class="form-note">这里只保存密码来源与名称，不填写密码。请在启动 Codex 的环境中设置变量；更改环境变量后重启 Codex。JSON 来源缺少名称时不会回退到共用密码。</p><div class="modal-actions"><button type="button" class="action" onclick="closeModal()">取消</button><button class="action primary" type="submit">保存连接</button></div></form></section></div>
<script>
const token=location.hash.slice(1)||sessionStorage.getItem('mysql-window-token')||'';
if(token)sessionStorage.setItem('mysql-window-token',token);history.replaceState(null,'',location.pathname);
let connections=[],selected=null,editing=null,busy=false;
const $=id=>document.getElementById(id),form=$('connection-form');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let timer;function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),5000)}
async function api(tool,args={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({tool,args})});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d.result}
async function load(){const d=await api('mysql_list_connections');connections=d.connections;connections.forEach(c=>c.def=c.name===d.default_connection);if(!connections.some(c=>c.name===selected))selected=d.default_connection||connections[0]?.name;render();$('connection-status').textContent=d.management_mode==='native_mcp'?'真实连接管理':'环境变量模式（仅查看）';if(d.management_mode!=='native_mcp')toast(d.message)}
async function run(fn){if(busy)return;busy=true;document.body.setAttribute('aria-busy','true');try{await fn()}catch(e){toast(e.message)}finally{busy=false;document.body.removeAttribute('aria-busy')}}
function render(){document.querySelector('.count').textContent=connections.length+' 个';$('connection-list').innerHTML=connections.map((c,i)=>`<div class="conn ${c.name===selected?'selected':''}" tabindex="0" role="button" data-i="${i}"><div class="conn-top"><span class="dbicon">▤</span><span class="conn-name">${esc(c.name)}</span>${c.def?'<span class="default-tag">默认</span>':''}</div><div class="conn-db">${esc(c.database)}</div></div>`).join('')||'<div class="empty">点击新增连接开始配置</div>';document.querySelectorAll('[data-i]').forEach(el=>{const select=()=>{selected=connections[el.dataset.i].name;render()};el.onclick=select;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}}});const c=connections.find(c=>c.name===selected);if(!c){$('detail').innerHTML='<div class="empty">还没有连接</div>';return}const field=(k,v)=>`<div class="field"><label>${k}</label><div class="value">${esc(v)}</div></div>`;
$('detail').innerHTML=`<div class="detail-head"><div class="conn-title"><span class="dbicon">▤</span><div><h2>${esc(c.name)}</h2><div class="host">${esc(c.host)}</div></div></div><div class="status">真实配置 · 尚未检测</div></div><div class="section"><div class="section-title">连接信息</div><div class="fields">${field('连接名称',c.name)+field('默认数据库',c.database)+field('主机',c.host)+field('端口',c.port)+field('用户名',c.user)+field('密码来源',c.password_source)+field('密码名称',c.password_source==='MYSQL_PASSWORDS_JSON'?c.password_key:'共用')+field('环境状态',c.password_configured?'已设置':'未设置，请配置环境变量并重启')}</div></div><div class="section"><div class="section-title">访问权限</div><div class="readonly"><div><strong>只读查询</strong><small>SELECT、SHOW、表结构与执行计划</small></div><span class="pill">允许</span></div><div class="readonly" style="margin-top:8px"><div><strong>受控 UPDATE</strong><small>带 WHERE；超过 10 行需审查确认</small></div><span class="pill ${c.allow_update?'':'off'}">${c.allow_update?'开启':'关闭'}</span></div></div><div class="section"><div class="section-title">连接选项</div><div class="fields">${field('连接池上限',c.connection_limit)+field('超时',c.connect_timeout_ms+' ms')+field('SSL',c.ssl?'开启':'关闭')+field('证书校验',c.ssl_reject_unauthorized?'开启':'关闭')}</div></div><div class="actions"><button class="action primary" id="health">检查连接</button><button class="action" id="edit">编辑配置</button><button class="action" id="default">${c.def?'清除默认':'设为默认'}</button><button class="action danger" id="delete">删除</button></div><pre id="health-result" style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:#657064"></pre>`;
$('edit').onclick=()=>openModal(c);$('health').onclick=()=>run(async()=>{$('health-result').textContent='正在连接数据库…';try{const r=await api('mysql_health_check',{connection:c.name});$('health-result').textContent=JSON.stringify(r.rows||r,null,2);document.querySelector('.status').textContent='连接成功'}catch(e){$('health-result').textContent='连接失败：'+e.message;document.querySelector('.status').textContent='连接失败'}});$('default').onclick=()=>run(async()=>{await api('mysql_set_default_connection',c.def?{}:{name:c.name});await load();toast('默认连接已更新')});$('delete').onclick=()=>{if(confirm(`确认删除真实连接 ${c.name}？环境变量中的密码不会被删除。`))run(async()=>{await api('mysql_delete_connection',{name:c.name,confirm:true});await load();toast('连接已删除')})}}
function openModal(c=null){if(busy)return;editing=c;form.reset();$('modal-title').textContent=c?'编辑真实连接':'新增真实连接';for(const [name,key]of Object.entries({name:'name',db:'database',host:'host',port:'port',user:'user',pool:'connection_limit',timeout:'connect_timeout_ms'}))form.elements[name].value=c?.[key]??({port:3306,pool:2,timeout:10000}[name]||'');form.elements.name.readOnly=!!c;form.elements.password_source.value=c?.password_source||'MYSQL_PASSWORD';form.elements.password_key.value=c?.password_key||c?.name||'';updatePasswordKey();for(const [name,key]of Object.entries({ssl:'ssl',update:'allow_update',verify:'ssl_reject_unauthorized'}))form.elements[name].checked=c?!!c[key]:name==='verify';$('modal-backdrop').classList.add('open');form.elements[c?'db':'name'].focus()}
function closeModal(){if(busy)return;$('modal-backdrop').classList.remove('open')}
form.onsubmit=e=>{e.preventDefault();if(busy)return;const f=form.elements,args={name:f.name.value.trim(),database:f.db.value.trim(),host:f.host.value.trim(),port:Number(f.port.value),user:f.user.value.trim(),connection_limit:Number(f.pool.value),connect_timeout_ms:Number(f.timeout.value),ssl:f.ssl.checked,ssl_reject_unauthorized:f.verify.checked,allow_update:f.update.checked,password_source:f.password_source.value,password_key:f.password_key.value.trim()||f.name.value.trim()};if(!editing&&connections.some(c=>c.name===args.name)){toast('连接名称已存在');return}if(args.allow_update&&!editing?.allow_update&&!confirm('确认允许此真实连接执行受控 UPDATE？'))return;if(editing?.ssl&&!args.ssl&&!confirm('确认关闭此连接的 SSL？'))return;if(!args.ssl_reject_unauthorized&&!confirm('确认关闭服务器证书校验？'))return;run(async()=>{form.querySelector('[type=submit]').disabled=true;try{toast('正在保存连接与环境变量引用…');const saved=await api('mysql_save_connection',args);selected=args.name;$('modal-backdrop').classList.remove('open');await load();toast(saved.runtime_warning||'真实配置已保存')}finally{form.querySelector('[type=submit]').disabled=false}})};
function updatePasswordKey(){const json=form.elements.password_source.value==='MYSQL_PASSWORDS_JSON';form.elements.password_key.disabled=!json;form.elements.password_key.closest('.form-field').hidden=!json}
form.elements.password_source.onchange=updatePasswordKey;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});run(load);
</script></body></html>
